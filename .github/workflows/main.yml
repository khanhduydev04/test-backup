# =============================================================================
# Supabase logical backup → Cloudflare R2  (PRODUCTION)
# -----------------------------------------------------------------------------
# → Commit this file to the BACKUP REPO (private) at:  .github/workflows/backup.yml
#
# Exactly ONE successful backup per UTC day, stored in R2 daily/.
#   - The workflow is scheduled 4× a day (20:17–23:17 UTC) as RETRY slots.
#   - Each run first checks R2 for today's daily/bbf_<YYYYMMDD>_* object:
#       exists  → skip everything (green no-op)
#       missing → pg_dump + upload
#     So the first success wins; a failed/dropped slot is retried by the next one.
# Retention is handled by R2 Object Lifecycle Rules (NOT this workflow):
#   - prefix daily/ : delete after 14 days → ~14 copies at steady state
#   Steady-state storage ≈ 14 × ~390 MB ≈ 5.5 GB → fits R2's 10 GB-month free tier.
# Reliability: concurrency lock, timeout guard, dead-man's-switch heartbeat.
#
# Validated config (test runs 2026-07-21): --jobs=2 --format=directory
# --compress=zstd:3 → ~4m42s, ~390MB, server PostgreSQL 17.6, session pooler 5432.
#
# ---- Secrets required (repo → Settings → Secrets and variables → Actions) ----
#   SUPABASE_DB_URL      session pooler string, port 5432 (NOT 6543, NOT direct)
#   R2_ACCOUNT_ID        Cloudflare account id
#   R2_ACCESS_KEY_ID     R2 API token (scoped to the backup bucket, Object R/W)
#   R2_SECRET_ACCESS_KEY R2 API token secret
#   R2_BUCKET            e.g. supabase-backups
#   HEALTHCHECK_URL      (recommended) dead-man's-switch ping URL, e.g. Healthchecks.io
# =============================================================================

name: supabase-backup

on:
  schedule:
    - cron: "17 20-23 * * *"   # 20:17, 21:17, 22:17, 23:17 UTC (= 03:17–06:17 ICT); retry slots, same UTC day
  workflow_dispatch:           # manual trigger; still skips if today's backup exists unless force=true
    inputs:
      force:
        description: "Backup even if today's daily backup already exists"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two backups overlap; runs queue behind each other, so the
# existence check below always sees the previous run's upload.
concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # measured dump ~5 min; fail fast if it hangs

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      # ---- 0. Already have today's backup? Then do nothing -------------------
      #      Deliberately NO "|| true": if R2 is unreachable / creds are wrong,
      #      fail loudly instead of mistaking it for "no backup yet".
      - name: Check today's backup in R2
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M)
          DAY="${STAMP:0:8}"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "force=true → backing up regardless"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          COUNT=$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" --prefix "daily/bbf_${DAY}_" --max-keys 1 \
            --query 'length(Contents || `[]`)' --output text \
            --endpoint-url "$ENDPOINT")

          if [ "$COUNT" -gt 0 ]; then
            echo "daily/bbf_${DAY}_* already exists → skip (1 backup/day)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backup for ${DAY} yet → proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- 1. pg_dump 17 client (force ahead of the runner's pre-installed v16)
      - name: Install postgresql-client 17 (PGDG)
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # ---- 2. Dump: data (parallel dir) + roles (companion), then tar --------
      - name: pg_dump (data + roles)
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/backup

          # 2a. Data — parallel, directory format, zstd:3
          pg_dump "$SUPABASE_DB_URL" \
            --format=directory --jobs=2 --compress=zstd:3 \
            --no-owner --no-privileges \
            --file=/tmp/backup/data

          # 2b. Roles/grants companion (definitions only; passwords excluded for
          #     security — document manual reset in the restore runbook).
          pg_dumpall -d "$SUPABASE_DB_URL" --roles-only --no-role-passwords \
            > /tmp/backup/roles.sql

          # 2c. Single artifact
          tar -cf "/tmp/bbf_${STAMP}.tar" -C /tmp backup
          echo "Artifact: $(du -h /tmp/bbf_${STAMP}.tar | cut -f1)"

      # ---- 3. Upload to R2 daily/ (aws-cli is preinstalled on ubuntu runners)
      - name: Upload to Cloudflare R2
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Retention: R2 lifecycle rule deletes daily/ objects older than 14 days.
          # The object only appears once the multipart upload completes, so a
          # half-uploaded file never counts as "today's backup" for the check above.
          aws s3 cp "/tmp/bbf_${STAMP}.tar" "s3://${R2_BUCKET}/daily/bbf_${STAMP}.tar" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded daily/bbf_${STAMP}.tar"

      # ---- 4. Dead-man's-switch: signal SUCCESS (also on skip: day is covered)
      - name: Heartbeat ping (success)
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || true
          fi

      # ---- 5. On failure: signal the monitor (next retry slot may still fix it)
      - name: Heartbeat ping (failure)
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            curl -fsS -m 10 --retry 3 "${HEALTHCHECK_URL}/fail" || true
          fi

      # ---- 6. Always wipe temp files off the runner --------------------------
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/backup /tmp/bbf_*.tar || true
